# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  # Flat master (opaque #3B82F6 + white glyph). Drives the legacy Android
  # mipmaps, the iOS appiconset and the macOS appiconset.
  image_path: "assets/app_icon/mosaic_icon.png"

  android: "launcher_icon"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#3B82F6"
  # Transparent-background white glyph. Used as BOTH the adaptive foreground
  # (composited over adaptive_icon_background) and the Android 13+ monochrome
  # layer (the launcher tints it using only its alpha channel).
  adaptive_icon_foreground: "assets/app_icon/mosaic_icon_glyph.png"
  adaptive_icon_monochrome: "assets/app_icon/mosaic_icon_glyph.png"

  ios: true
  remove_alpha_ios: true

  web:
    generate: false

  windows:
    generate: false

  macos:
    generate: true
    image_path: "assets/app_icon/mosaic_icon.png"
